line-length = 100
target-version = "py311"

[lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # ordenação de imports (isort)
  "N",        # convenções de nomes (PEP 8)
  "UP",       # sintaxe moderna do Python
  "B",        # bugs prováveis (bugbear)
]

[format]
quote-style = "double"
indent-style = "space"
