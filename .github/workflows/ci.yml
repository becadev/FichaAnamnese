name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Todo `run` executa dentro da API; o checkout continua na raiz do repositório.
defaults:
  run:
    working-directory: FichaAnamnese_api

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      # Os testes de higiene usam `git ls-files` e `git check-ignore`,
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            FichaAnamnese_api/requirements.txt
            FichaAnamnese_api/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Executar testes
        run: pytest -q

  imagem:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: testes
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # Só valida que o Dockerfile constrói; nada é publicado em registry.
      - name: Construir a imagem
        run: docker build -t ficha-anamnese-api:${{ github.sha }} .
