name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

# Todo `run` executa dentro da API; 
defaults:
  run:
    working-directory: FichaAnamnese_api

jobs:
  testes:
    name: Testes
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            FichaAnamnese_api/requirements.txt
            FichaAnamnese_api/requirements-dev.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Executar testes
        run: pytest -q
  lint: 
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Verificar formatação (Ruff)
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

      - name: Rodar Ruff Linter
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"
  duplicacao:
    name: Código duplicado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Instalar o Pylint
        run: pip install pylint==4.1.3

      # config em .pylintrc (raiz)
      # pylintrc e os caminhos abaixo partem da raiz do repositório 
      - name: Detectar código duplicado (Pylint)
        working-directory: .
        # Arquivos listados um a um: o Pylint não entra em pastas sem __init__.py (ex.: app/modules).
        run: pylint $(git ls-files 'FichaAnamnese_api/app/*.py' 'FichaAnamnese_api/tests/*.py')
  imagem:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: [testes, lint, duplicacao]
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      # Só valida que o Dockerfile constrói; nada é publicado em registry.
      - name: Construir a imagem
        run: docker build -t ficha-anamnese-api:${{ github.sha }} .
