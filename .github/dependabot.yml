version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "pip"
    directory: "/FichaAnamnese_api"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker"
    directories:
      - "/FichaAnamnese_api"
      - "/FichaAnamnese_api/.devcontainer"
    schedule:
      interval: "weekly"
